name: Linting

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    name: Run Linters
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install the project
        run: uv sync --all-extras --dev

      - name: Run Black (Code Formatter)
        run: uv run --frozen pre-commit run black --all-files --show-diff-on-failure

      - name: Run isort (Import Sorting)
        run: uv run --frozen pre-commit run isort --all-files --show-diff-on-failure

      - name: Run flake8 (Linting)
        run: uv run --frozen pre-commit run flake8 --all-files

      - name: Run mypy (Type Checking)
        run: uv run --frozen pre-commit run mypy --all-files

      - name: Run file hygiene checks
        run: uv run --frozen pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: black,isort,flake8,mypy
