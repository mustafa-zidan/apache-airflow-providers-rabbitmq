# Formatters, linters and mypy run from the project environment (`uv run`), so
# their versions come from uv.lock and match what the lint workflow runs.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]  # Kubernetes manifests
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run --frozen black
        language: system
        types: [python]
        files: ^(src|tests)/
      - id: isort
        name: isort
        entry: uv run --frozen isort
        language: system
        types: [python]
        files: ^(src|tests)/
      - id: flake8
        name: flake8
        entry: uv run --frozen flake8
        language: system
        types: [python]
        files: ^(src|tests)/
      - id: mypy
        name: mypy
        entry: uv run --frozen mypy src/
        language: system
        types: [python]
        files: ^src/
        pass_filenames: false
