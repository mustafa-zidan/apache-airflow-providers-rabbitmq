[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apache-airflow-provider-rabbitmq"
version = "5.1.0"
description = "Airflow provider for RabbitMQ with sync/async messaging."
authors = [
    { name = "Mustafa Abuelfadl", email = "mustafa@zidan.me" }
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "apache-airflow>=2.8.0",
    "pika>=1.4.4",
    "aio-pika>=10.1.0",
]

[project.optional-dependencies]
development = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.0.0,<2.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "testcontainers>=4.15.0",
    "trustme>=1.2.0",
    "pylint>=4.0.0,<5.0.0",
    "black>=26.0.0,<27.0.0",
    "flake8>=7.4.1,<8.0.0",
    "isort>=9.0.0,<10.0.0",
    "mypy>=2.0.0,<3.0.0",
    "types-PyYAML>=6.0.0",
    "tox>=4.64.8",
    "tox-uv>=1.36.1",
    "pre-commit>=4.0.0",
]

[project.urls]
Documentation = "https://github.com/mustafa-zidan/apache-airflow-providers-rabbitmq"
Issues = "https://github.com/mustafa-zidan/apache-airflow-providers-rabbitmq/issues"
"Source Code" = "https://github.com/mustafa-zidan/apache-airflow-providers-rabbitmq"

[project.entry-points."apache_airflow_provider"]
provider_info = "airflow.provider.rabbitmq.get_provider_info:get_provider_info"

[tool.hatch.build.targets.wheel]
packages = ["src/airflow"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = "tests"
pythonpath = "src"
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.pylint.format]
max-line-length = 120

[tool.mypy]
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

# Ignore missing library stubs
[[tool.mypy.overrides]]
module = [
    "pika.*",
    "aio_pika.*",
    "airflow.*",
]
ignore_missing_imports = true
