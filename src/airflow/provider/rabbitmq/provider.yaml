name: "RabbitMQ"
package-name: "apache-airflow-provider-rabbitmq"
description: "Airflow provider for RabbitMQ with sync/async messaging."
versions:
  - 5.0.1
  - 5.0.0
  - 4.1.0
  - 4.0.0
  - 3.0.1
  - 3.0.0
  - 2.1.1
  - 2.1.0
  - 2.0.0
  - 1.1.0
  - 1.0.0
integrations:
  - integration-name: RabbitMQ
    external-doc-url: https://github.com/mustafa-zidan/apache-airflow-providers-rabbitmq
    tags: ["software"]
hooks:
  - integration-name: RabbitMQ
    python-modules:
      - airflow.provider.rabbitmq.hooks.rabbitmq_hook
operators:
  - integration-name: RabbitMQ
    python-modules:
      - airflow.provider.rabbitmq.operators.rabbitmq_producer
sensors:
  - integration-name: RabbitMQ
    python-modules:
      - airflow.provider.rabbitmq.sensors.rabbitmq_sensor
triggers:
  - integration-name: RabbitMQ
    python-modules:
      - airflow.provider.rabbitmq.triggers.rabbitmq_trigger
connection-types:
  - connection-type: rabbitmq
    hook-class-name: airflow.provider.rabbitmq.hooks.rabbitmq_hook.RabbitMQHook
    ui-field-behaviour:
      placeholders:
        host: localhost
        port: "5672"
        schema: /
release-notes:
  - URL: https://github.com/mustafa-zidan/apache-airflow-providers-rabbitmq/blob/main/RELEASE_NOTES.md
