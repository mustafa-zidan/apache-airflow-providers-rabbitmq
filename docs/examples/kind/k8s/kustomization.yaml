apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rabbitmq-provider
resources:
  - namespace.yaml
  - postgres.yaml
  - rabbitmq.yaml
  - airflow.yaml
configMapGenerator:
  - name: rabbitmq-config
    files:
      - rabbitmq/rabbitmq.conf
      - rabbitmq/definitions.json
  - name: airflow-scripts
    files:
      - airflow/start.sh
      - airflow/connections.py
      - airflow/verify.py
# Generated by `kind.sh up` into generated/; never committed.
secretGenerator:
  - name: rabbitmq-server-tls
    files:
      - ca.pem=generated/ca.pem
      - server.pem=generated/server.pem
      - server.key=generated/server.key
  - name: airflow-client-tls
    files:
      - ca.pem=generated/ca.pem
      - client.pem=generated/client.pem
      - client.key=generated/client.key
  - name: airflow-fernet-key
    files:
      - fernet-key=generated/fernet_key
