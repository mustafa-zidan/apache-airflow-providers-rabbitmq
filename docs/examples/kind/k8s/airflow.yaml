# Airflow in standalone mode: API server, scheduler, DAG processor and triggerer in
# one container, with LocalExecutor on Postgres.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow
spec:
  selector:
    matchLabels: { app: airflow }
  strategy: { type: Recreate }
  template:
    metadata:
      labels: { app: airflow }
    spec:
      enableServiceLinks: false
      containers:
        - name: airflow
          # Built from ../local-airflow/Containerfile and loaded into the node by kind.sh
          image: localhost/rabbitmq-provider-airflow:kind
          imagePullPolicy: Never
          command: [bash, /opt/airflow/scripts/start.sh]
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              value: postgresql+psycopg2://airflow:airflow@postgres/airflow
            - name: AIRFLOW__CORE__FERNET_KEY
              valueFrom:
                secretKeyRef: { name: airflow-fernet-key, key: fernet-key }
            - { name: AIRFLOW__CORE__LOAD_EXAMPLES, value: "False" }
            # Every visitor is an admin, so the UI opens without a login page.
            - { name: AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS, value: "True" }
            - { name: AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL, value: "10" }
            - { name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION, value: "True" }
          readinessProbe:
            httpGet: { path: /api/v2/monitor/health, port: http }
            periodSeconds: 10
            failureThreshold: 60
          volumeMounts:
            - { name: scripts, mountPath: /opt/airflow/scripts, readOnly: true }
            - { name: dags, mountPath: /opt/airflow/dags, readOnly: true }
            - { name: plugins, mountPath: /opt/airflow/plugins, readOnly: true }
            # The provider is installed in editable mode from here, so source edits
            # only need `kind.sh restart`.
            - { name: provider-src, mountPath: /opt/provider/src, readOnly: true }
            - { name: tls, mountPath: /opt/airflow/certs, readOnly: true }
      volumes:
        - name: scripts
          configMap: { name: airflow-scripts }
        - name: dags
          hostPath: { path: /provider/docs/examples/kind/dags, type: Directory }
        - name: plugins
          hostPath: { path: /provider/docs/examples/kind/plugins, type: Directory }
        - name: provider-src
          hostPath: { path: /provider/src, type: Directory }
        - name: tls
          secret: { secretName: airflow-client-tls }
---
apiVersion: v1
kind: Service
metadata:
  name: airflow
spec:
  type: NodePort
  selector: { app: airflow }
  ports:
    - { name: http, port: 8080, nodePort: 30080 }
