[tox]
requires = tox-uv>=1.36.1
envlist =
    py{311,312}-airflow{28,29,210,30,31}
    py{313,314}-airflow{32,33}
    py312-airflow{210,31}-integration
    py{313,314}-airflow{32,33}-integration
skipsdist = True

[testenv]
description = run unit/integration tests with specific Python and Airflow versions
deps =
    pytest>=9.0.0,<10.0.0
    pytest-asyncio>=1.0.0,<2.0.0
    pytest-cov>=7.0.0,<8.0.0
    pika>=1.4.4
    aio-pika>=10.1.0
    airflow28: apache-airflow>=2.8.0,<2.9.0
    airflow29: apache-airflow>=2.9.0,<2.10.0
    airflow210: apache-airflow>=2.10.0,<2.11.0
    airflow30: apache-airflow>=3.0.0,<3.1.0
    airflow31: apache-airflow>=3.1.0,<3.2.0
    airflow31: sqlalchemy-utils>=0.41.0
    airflow32: apache-airflow>=3.2.0,<3.3.0
    airflow33: apache-airflow>=3.3.0,<4.0.0
    integration: testcontainers>=4.15.0
setenv =
    PYTHONPATH = {toxinidir}/src
commands =
    !integration: pytest tests/unit {posargs}
    integration: pytest tests/integration {posargs}

[flake8]
max-line-length = 88
extend-ignore = E203
# Ignore line length in docstrings and comments
per-file-ignores =
    src/airflow/provider/rabbitmq/hooks/rabbitmq_hook.py:E501
    src/airflow/provider/rabbitmq/operators/rabbitmq_producer.py:E501
    src/airflow/provider/rabbitmq/sensors/rabbitmq_sensor.py:E501
    tests/integration/test_rabbitmq_integration.py:E501
